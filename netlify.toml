[build]
  base = "client"
  command = "npm install && npm run build"
  # `publish` is resolved relative to `base`, which is already "client" -- the
  # previous value "client/dist" doubled up to "client/client/dist" (a directory
  # that doesn't exist), which is exactly the "Deploy directory ... does not
  # exist" error Netlify reported. Publish is just the build output folder
  # within the base directory.
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
