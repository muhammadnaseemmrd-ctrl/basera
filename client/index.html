<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Found during live QA: basera.pk is a live, unrelated third-party rental
         listing website (different business, different contact info/branding) --
         NOT this project's domain. Every canonical/OG/Twitter/structured-data URL
         here previously pointed at it, which would have misdirected search-engine
         canonicalization and social-share previews to someone else's site entirely.
         Pointing these at the actual deployed origin until/unless a real custom
         domain this project controls is set up. Frontend moved from Netlify to
         Vercel (Netlify free-tier credits exhausted) on Sept 13, 2026 -- update
         this block again if the hosting origin changes further. -->
    <link rel="canonical" href="https://basera-cyan.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00535B" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Basera" />
    <meta name="keywords" content="hostels in Pakistan, student housing Pakistan, verified hostels, PG accommodation, rooms near university, girls hostel, boys hostel, Lahore hostels, Islamabad hostels, Karachi hostels, NUST hostel, LUMS hostel, FAST hostel, student accommodation booking" />
    <meta
      name="description"
      content="Basera helps students and young professionals find verified, affordable hostels, PGs, and rooms near universities across Pakistan. Browse listings, compare prices, and book safely with escrow-protected payments."
    />
    <title>Basera | Verified Student Hostels & Rooms in Pakistan</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Basera" />
    <meta property="og:title" content="Basera | Verified Student Hostels & Rooms in Pakistan" />
    <meta
      property="og:description"
      content="Find your Basera. Verified hostels, PGs, and rooms near major Pakistani universities with safe, escrow-protected booking."
    />
    <meta property="og:url" content="https://basera-cyan.vercel.app/" />
    <meta property="og:image" content="https://basera-cyan.vercel.app/logo.svg" />
    <meta property="og:locale" content="en_PK" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Basera | Verified Student Hostels & Rooms in Pakistan" />
    <meta
      name="twitter:description"
      content="Find your Basera. Verified hostels, PGs, and rooms near major Pakistani universities with safe, escrow-protected booking."
    />
    <meta name="twitter:image" content="https://basera-cyan.vercel.app/logo.svg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Basera",
        "url": "https://basera-cyan.vercel.app",
        "logo": "https://basera-cyan.vercel.app/logo.svg",
        "description": "Basera is a verified student accommodation marketplace for Pakistan, connecting students and young professionals with hostels, PGs, and shared rooms near major universities.",
        "areaServed": "PK",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
