<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="Arial, sans-serif">
  <rect width="1240" height="560" fill="#FFFFFF"/>
  <text x="620" y="34" font-size="20" font-weight="800" fill="#182338" text-anchor="middle">Basera — Simplified Core Data Model</text>
  <text x="620" y="54" font-size="11" fill="#94A3B8" text-anchor="middle">14 of 60+ Mongoose models shown — the entities that drive the core booking &amp; trust flow</text>

  <g font-size="12">
    <rect x="30" y="90" width="170" height="60" rx="10" fill="#FFE2D6" stroke="#FF6B4A"/>
    <text x="115" y="115" text-anchor="middle" font-weight="800" fill="#182338">User</text>
    <text x="115" y="134" text-anchor="middle" font-size="10" fill="#64748B">role, profile, occupant info</text>

    <rect x="250" y="30" width="180" height="60" rx="10" fill="#D7DEEC" stroke="#1B2A4A"/>
    <text x="340" y="55" text-anchor="middle" font-weight="800" fill="#182338">HostelGroup</text>
    <text x="340" y="74" text-anchor="middle" font-size="10" fill="#64748B">multi-branch brand</text>

    <rect x="250" y="100" width="180" height="60" rx="10" fill="#D7DEEC" stroke="#1B2A4A"/>
    <text x="340" y="125" text-anchor="middle" font-weight="800" fill="#182338">Hostel</text>
    <text x="340" y="144" text-anchor="middle" font-size="10" fill="#64748B">property, verification</text>

    <rect x="250" y="170" width="180" height="55" rx="10" fill="#D7DEEC" stroke="#1B2A4A"/>
    <text x="340" y="193" text-anchor="middle" font-weight="800" fill="#182338">Block</text>
    <text x="340" y="211" text-anchor="middle" font-size="10" fill="#64748B">physical section, warden</text>

    <rect x="480" y="90" width="180" height="60" rx="10" fill="#FFF3C4" stroke="#E0A63A"/>
    <text x="570" y="115" text-anchor="middle" font-weight="800" fill="#182338">Room</text>
    <text x="570" y="134" text-anchor="middle" font-size="10" fill="#64748B">type, price, beds</text>

    <rect x="480" y="170" width="180" height="55" rx="10" fill="#FFF3C4" stroke="#E0A63A"/>
    <text x="570" y="193" text-anchor="middle" font-weight="800" fill="#182338">BedBlock</text>
    <text x="570" y="211" text-anchor="middle" font-size="10" fill="#64748B">held / repair / booked_offline</text>

    <rect x="710" y="90" width="190" height="60" rx="10" fill="#E6FAF2" stroke="#0E9F6E"/>
    <text x="805" y="115" text-anchor="middle" font-weight="800" fill="#182338">Booking</text>
    <text x="805" y="134" text-anchor="middle" font-size="10" fill="#64748B">student ↔ room, status</text>

    <rect x="950" y="90" width="230" height="60" rx="10" fill="#FDECEC" stroke="#E02424"/>
    <text x="1065" y="115" text-anchor="middle" font-weight="800" fill="#182338">EscrowTransaction / LedgerEntry</text>
    <text x="1065" y="134" text-anchor="middle" font-size="10" fill="#64748B">held, commission, payout</text>

    <rect x="710" y="170" width="190" height="55" rx="10" fill="#E6FAF2" stroke="#0E9F6E"/>
    <text x="805" y="193" text-anchor="middle" font-weight="800" fill="#182338">Dispute / DepositCase</text>
    <text x="805" y="211" text-anchor="middle" font-size="10" fill="#64748B">resolution workflow</text>

    <rect x="950" y="170" width="230" height="55" rx="10" fill="#E6FAF2" stroke="#0E9F6E"/>
    <text x="1065" y="193" text-anchor="middle" font-weight="800" fill="#182338">Review / RoommateProfile</text>
    <text x="1065" y="211" text-anchor="middle" font-size="10" fill="#64748B">trust &amp; occupant visibility</text>

    <!-- Stays vertical -->
    <rect x="480" y="280" width="180" height="60" rx="10" fill="#FFE2D6" stroke="#FF6B4A"/>
    <text x="570" y="305" text-anchor="middle" font-weight="800" fill="#182338">Property (Stay)</text>
    <text x="570" y="324" text-anchor="middle" font-size="10" fill="#64748B">hotel / guest house</text>

    <rect x="710" y="280" width="190" height="60" rx="10" fill="#FFE2D6" stroke="#FF6B4A"/>
    <text x="805" y="305" text-anchor="middle" font-weight="800" fill="#182338">StayBooking</text>
    <text x="805" y="324" text-anchor="middle" font-size="10" fill="#64748B">nightly rate, date range</text>

    <rect x="30" y="280" width="180" height="60" rx="10" fill="#FFE2D6" stroke="#FF6B4A"/>
    <text x="120" y="305" text-anchor="middle" font-weight="800" fill="#182338">TenancyAgreement</text>
    <text x="120" y="324" text-anchor="middle" font-size="10" fill="#64748B">digital, signed by both sides</text>
  </g>

  <g stroke="#94A3B8" stroke-width="1.6" fill="none" marker-end="url(#arrowER)">
    <line x1="200" y1="110" x2="248" y2="60"/>
    <line x1="200" y1="120" x2="248" y2="128"/>
    <line x1="200" y1="130" x2="248" y2="196"/>
    <line x1="430" y1="120" x2="478" y2="118"/>
    <line x1="430" y1="192" x2="478" y2="196"/>
    <line x1="660" y1="115" x2="708" y2="118"/>
    <line x1="660" y1="196" x2="708" y2="195"/>
    <line x1="900" y1="120" x2="948" y2="118"/>
    <line x1="805" y1="150" x2="805" y2="168"/>
    <line x1="900" y1="197" x2="948" y2="197"/>
    <line x1="200" y1="140" x2="200" y2="278" />
    <line x1="115" y1="150" x2="115" y2="278"/>
    <line x1="200" y1="310" x2="478" y2="310"/>
    <line x1="660" y1="310" x2="708" y2="310"/>
  </g>
  <defs>
    <marker id="arrowER" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <text x="620" y="410" text-anchor="middle" font-size="11" fill="#94A3B8">The student long-stay path (left/centre, escrow + contact gating) and the short-stay Hotels/Guest-Houses path (bottom, direct contact) are deliberately separate models sharing the same trust layer.</text>
</svg>
