<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, sans-serif">
  <rect width="1200" height="420" fill="#FFFFFF"/>
  <text x="600" y="34" font-size="20" font-weight="800" fill="#182338" text-anchor="middle">Student Booking &amp; Escrow Workflow</text>

  <!-- step boxes -->
  <g font-size="12">
    <rect x="20" y="80" width="160" height="90" rx="12" fill="#FFE2D6" stroke="#FF6B4A"/>
    <text x="100" y="115" text-anchor="middle" font-weight="700" fill="#182338">1. Browse &amp;</text>
    <text x="100" y="132" text-anchor="middle" font-weight="700" fill="#182338">Match</text>
    <text x="100" y="150" text-anchor="middle" fill="#64748B">Search, filters,</text>
    <text x="100" y="164" text-anchor="middle" fill="#64748B">AI match quiz</text>

    <rect x="216" y="80" width="160" height="90" rx="12" fill="#FFE2D6" stroke="#FF6B4A"/>
    <text x="296" y="115" text-anchor="middle" font-weight="700" fill="#182338">2. Contact</text>
    <text x="296" y="132" text-anchor="middle" font-weight="700" fill="#182338">Gated</text>
    <text x="296" y="150" text-anchor="middle" fill="#64748B">Host phone/email</text>
    <text x="296" y="164" text-anchor="middle" fill="#64748B">hidden until paid</text>

    <rect x="412" y="80" width="160" height="90" rx="12" fill="#D7DEEC" stroke="#1B2A4A"/>
    <text x="492" y="115" text-anchor="middle" font-weight="700" fill="#182338">3. Pay: Rent +</text>
    <text x="492" y="132" text-anchor="middle" font-weight="700" fill="#182338">Deposit + Fee</text>
    <text x="492" y="150" text-anchor="middle" fill="#64748B">Optional deposit</text>
    <text x="492" y="164" text-anchor="middle" fill="#64748B">protection add-on</text>

    <rect x="608" y="80" width="160" height="90" rx="12" fill="#FFC857" stroke="#E0A63A"/>
    <text x="688" y="115" text-anchor="middle" font-weight="700" fill="#182338">4. Held in</text>
    <text x="688" y="132" text-anchor="middle" font-weight="700" fill="#182338">Escrow</text>
    <text x="688" y="150" text-anchor="middle" fill="#182338">Commission calc'd,</text>
    <text x="688" y="164" text-anchor="middle" fill="#182338">funds not released</text>

    <rect x="804" y="80" width="160" height="90" rx="12" fill="#E6FAF2" stroke="#0E9F6E"/>
    <text x="884" y="115" text-anchor="middle" font-weight="700" fill="#182338">5. Move-In +</text>
    <text x="884" y="132" text-anchor="middle" font-weight="700" fill="#182338">Hold Window</text>
    <text x="884" y="150" text-anchor="middle" fill="#64748B">Check-in verify,</text>
    <text x="884" y="164" text-anchor="middle" fill="#64748B">48h no-dispute hold</text>

    <rect x="1000" y="80" width="180" height="90" rx="12" fill="#E6FAF2" stroke="#0E9F6E"/>
    <text x="1090" y="115" text-anchor="middle" font-weight="700" fill="#182338">6. Host Payout</text>
    <text x="1090" y="132" text-anchor="middle" fill="#64748B">Rent − commission</text>
    <text x="1090" y="150" text-anchor="middle" fill="#64748B">released to host</text>
    <text x="1090" y="164" text-anchor="middle" fill="#64748B">statement/PDF issued</text>
  </g>

  <!-- arrows -->
  <g stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="125" x2="214" y2="125"/>
    <line x1="376" y1="125" x2="410" y2="125"/>
    <line x1="572" y1="125" x2="606" y2="125"/>
    <line x1="768" y1="125" x2="802" y2="125"/>
    <line x1="964" y1="125" x2="998" y2="125"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- dispute branch -->
  <rect x="608" y="250" width="360" height="90" rx="12" fill="#FDECEC" stroke="#E02424"/>
  <text x="788" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#182338">If disputed before payout:</text>
  <text x="788" y="300" text-anchor="middle" font-size="12" fill="#64748B">Escrow stays blocked → admin reviews evidence</text>
  <text x="788" y="318" text-anchor="middle" font-size="12" fill="#64748B">→ resolution letter issued (PDF) → funds released per ruling</text>
  <path d="M688 170 L688 230 L788 230 L788 248" stroke="#E02424" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="600" y="400" font-size="11" fill="#94A3B8" text-anchor="middle">Off-platform payment reports also block payout automatically and open a high-priority review case</text>
</svg>
