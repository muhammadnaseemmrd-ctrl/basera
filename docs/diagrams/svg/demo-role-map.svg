  <text x="620" y="470" text-anchor="middle" font-size="12" fill="#182338" font-weight="700">All demo accounts use password: password123</text>
  <text x="620" y="492" text-anchor="middle" font-size="11" fill="#94A3B8">Every screen below works in demo mode with zero database setup — see the step-by-step script for each role in this guide</text>
