<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" font-family="Arial, sans-serif">
  <rect width="1240" height="520" fill="#FFFFFF"/>
  <text x="620" y="34" font-size="22" font-weight="800" fill="#182338" text-anchor="middle">Basera — Demo Map: Where to Log In as Each Role</text>

  <g font-size="12">
    <rect x="30" y="66" width="270" height="100" rx="12" fill="#FFE2D6" stroke="#FF6B4A"/>
    <text x="165" y="90" text-anchor="middle" font-weight="800" fill="#182338">Student</text>
    <text x="165" y="110" text-anchor="middle" fill="#64748B">student@basera.pk</text>
    <text x="165" y="128" text-anchor="middle" fill="#64748B">/dashboard</text>
    <text x="165" y="146" text-anchor="middle" fill="#64748B">Search → book → pay → chat</text>

    <rect x="330" y="66" width="270" height="100" rx="12" fill="#FFE2D6" stroke="#FF6B4A"/>
    <text x="465" y="90" text-anchor="middle" font-weight="800" fill="#182338">Independent Host</text>
    <text x="465" y="110" text-anchor="middle" fill="#64748B">landlord@basera.pk</text>
    <text x="465" y="128" text-anchor="middle" fill="#64748B">/host/dashboard</text>
    <text x="465" y="146" text-anchor="middle" fill="#64748B">Rooms → tenants → Growth Center</text>

    <rect x="630" y="66" width="270" height="100" rx="12" fill="#D7DEEC" stroke="#1B2A4A"/>
    <text x="765" y="90" text-anchor="middle" font-weight="800" fill="#182338">Hostel Group Owner</text>
    <text x="765" y="110" text-anchor="middle" fill="#64748B">owner@basera.pk</text>
    <text x="765" y="128" text-anchor="middle" fill="#64748B">/hostel-groups/royal-group</text>
    <text x="765" y="146" text-anchor="middle" fill="#64748B">One brand, three branches</text>

    <rect x="930" y="66" width="270" height="100" rx="12" fill="#D7DEEC" stroke="#1B2A4A"/>
    <text x="1065" y="90" text-anchor="middle" font-weight="800" fill="#182338">Warden</text>
    <text x="1065" y="110" text-anchor="middle" fill="#64748B">warden@basera.pk</text>
    <text x="1065" y="128" text-anchor="middle" fill="#64748B">/warden/dashboard</text>
    <text x="1065" y="146" text-anchor="middle" fill="#64748B">One block, mark seats booked</text>

    <rect x="180" y="196" width="270" height="100" rx="12" fill="#FFF3C4" stroke="#E0A63A"/>
