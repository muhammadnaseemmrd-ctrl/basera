    <text x="315" y="240" text-anchor="middle" fill="#64748B">landlord@basera.pk</text>
    <text x="315" y="258" text-anchor="middle" fill="#64748B">/host/stays</text>
    <text x="315" y="276" text-anchor="middle" fill="#64748B">Nightly listings, date bookings</text>

    <rect x="480" y="196" width="270" height="100" rx="12" fill="#FFF3C4" stroke="#E0A63A"/>
    <text x="615" y="220" text-anchor="middle" font-weight="800" fill="#182338">Traveller / Guest</text>
    <text x="615" y="240" text-anchor="middle" fill="#64748B">no login needed</text>
    <text x="615" y="258" text-anchor="middle" fill="#64748B">/stays</text>
    <text x="615" y="276" text-anchor="middle" fill="#64748B">Search Murree, Naran, book a stay</text>

    <rect x="780" y="196" width="270" height="100" rx="12" fill="#E6FAF2" stroke="#0E9F6E"/>
    <text x="915" y="220" text-anchor="middle" font-weight="800" fill="#182338">Admin</text>
    <text x="915" y="240" text-anchor="middle" fill="#64748B">admin@basera.pk</text>
    <text x="915" y="258" text-anchor="middle" fill="#64748B">/admin/dashboard</text>
    <text x="915" y="276" text-anchor="middle" fill="#64748B">Verify, moderate, run finance</text>

    <rect x="480" y="326" width="270" height="100" rx="12" fill="#FDECEC" stroke="#E02424"/>
    <text x="615" y="350" text-anchor="middle" font-weight="800" fill="#182338">Parent / Guardian</text>
    <text x="615" y="370" text-anchor="middle" fill="#64748B">no login — share link</text>
    <text x="615" y="388" text-anchor="middle" fill="#64748B">/parent-portal/:token</text>
    <text x="615" y="406" text-anchor="middle" fill="#64748B">Read-only safety &amp; visit view</text>
